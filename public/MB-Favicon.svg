<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tło: Zaokrąglony kwadrat w ciemnym kolorze -->
  <rect width="100" height="100" rx="20" ry="20" fill="#2d3748"/>
  
  <!-- Stylizacja tekstu -->
  <style>
    .initials { font: bold 40px sans-serif; fill: white; }
    .brackets { font: bold 40px sans-serif; fill: #63b3ed; }
  </style>
  
  <!-- Inicjały MB z nawiasami developerskimi < /> -->
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle">
    <tspan class="brackets">&lt;</tspan>
    <tspan class="initials">MB</tspan>
    <tspan class="brackets">/&gt;</tspan>
  </text>
</svg>
